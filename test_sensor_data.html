<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Sensor Data Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.1em;
        }

        .status.connected {
            background: #10b981;
            color: white;
        }

        .status.disconnected {
            background: #ef4444;
            color: white;
        }

        .status.waiting {
            background: #f59e0b;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .sensor-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .sensor-card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sensor-card h2::before {
            content: "📡";
            font-size: 1.2em;
        }

        .data-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            padding: 12px;
            margin: 8px 0;
            background: #f8fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .data-label {
            font-weight: bold;
            color: #64748b;
        }

        .data-value {
            font-family: 'Courier New', monospace;
            color: #334155;
            font-size: 1.1em;
        }

        .raw-data {
            background: #1e293b;
            color: #10b981;
            padding: 20px;
            border-radius: 15px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .raw-data h2 {
            color: #10b981;
            margin-bottom: 15px;
        }

        .last-update {
            text-align: center;
            color: white;
            font-size: 1.1em;
            margin-top: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-size: 1.2em;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .updating {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔬 ESP32 Sensor Data Monitor</h1>
            <div id="status" class="status waiting">⏳ Waiting for data...</div>
            <div class="last-update" id="lastUpdate">Never updated</div>
        </div>

        <div class="grid" id="sensorGrid">
            <div class="no-data">
                Connecting to backend...
            </div>
        </div>

        <div class="raw-data">
            <h2>📊 Raw JSON Data</h2>
            <pre id="rawData">Waiting for sensor data...</pre>
        </div>
    </div>

    <script>
        let lastData = null;
        let updateCount = 0;

        async function fetchSensorData() {
            try {
                const response = await fetch('http://localhost:5000/api/wearable/data');
                const data = await response.json();

                // Check if data is empty
                if (Object.keys(data).length === 0) {
                    document.getElementById('status').className = 'status waiting';
                    document.getElementById('status').textContent = '⏳ No data received yet';
                    document.getElementById('rawData').textContent = 'Backend is running but no sensor data received.\n\nCheck Arduino Serial Monitor for connection status.';
                    return;
                }

                // Data received!
                updateCount++;
                document.getElementById('status').className = 'status connected';
                document.getElementById('status').textContent = `✅ Connected (${updateCount} updates)`;
                
                // Update last update time
                const now = new Date();
                document.getElementById('lastUpdate').textContent = 
                    `Last update: ${now.toLocaleTimeString()}`;

                // Display sensor cards
                displaySensorCards(data);

                // Display raw JSON
                document.getElementById('rawData').textContent = 
                    JSON.stringify(data, null, 2);

                lastData = data;

            } catch (error) {
                document.getElementById('status').className = 'status disconnected';
                document.getElementById('status').textContent = '❌ Backend disconnected';
                document.getElementById('rawData').textContent = 
                    `Error: ${error.message}\n\nIs the backend running?\nRun: python app.py`;
                console.error('Error fetching data:', error);
            }
        }

        function displaySensorCards(data) {
            const grid = document.getElementById('sensorGrid');
            grid.innerHTML = '';

            for (const [sensorName, sensorData] of Object.entries(data)) {
                const card = document.createElement('div');
                card.className = 'sensor-card updating';
                
                let cardHTML = `<h2>${sensorName}</h2>`;

                // Accelerometer data
                if (sensorData.ax !== undefined) {
                    cardHTML += `
                        <div class="data-row">
                            <span class="data-label">Accel X:</span>
                            <span class="data-value">${sensorData.ax.toFixed(3)} g</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Accel Y:</span>
                            <span class="data-value">${sensorData.ay.toFixed(3)} g</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Accel Z:</span>
                            <span class="data-value">${sensorData.az.toFixed(3)} g</span>
                        </div>
                    `;
                }

                // Gyroscope data
                if (sensorData.gx !== undefined) {
                    cardHTML += `
                        <div class="data-row">
                            <span class="data-label">Gyro X:</span>
                            <span class="data-value">${sensorData.gx.toFixed(2)} °/s</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Gyro Y:</span>
                            <span class="data-value">${sensorData.gy.toFixed(2)} °/s</span>
                        </div>
                        <div class="data-row">
                            <span class="data-label">Gyro Z:</span>
                            <span class="data-value">${sensorData.gz.toFixed(2)} °/s</span>
                        </div>
                    `;
                }

                card.innerHTML = cardHTML;
                grid.appendChild(card);

                // Remove animation after a bit
                setTimeout(() => {
                    card.classList.remove('updating');
                }, 500);
            }
        }

        // Fetch data every second
        setInterval(fetchSensorData, 1000);
        
        // Initial fetch
        fetchSensorData();
    </script>
</body>
</html>
